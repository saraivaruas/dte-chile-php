name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - run: php php/tests/run.php
  spec-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/gen_spec.py
      - name: La especificación generada debe coincidir con la versionada
        run: git diff --exit-code
